<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft sign-in</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #300045;
        background:
          radial-gradient(circle at 50% 10%, rgba(255, 186, 46, 0.25), transparent 16rem),
          linear-gradient(135deg, #300045, #642b87);
      }

      main {
        display: grid;
        justify-items: center;
        gap: 14px;
        width: min(360px, calc(100vw - 32px));
        border: 1px solid rgba(255, 186, 46, 0.36);
        border-radius: 22px;
        padding: 28px;
        text-align: center;
        background: #fff;
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.24);
      }

      .mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 999px;
        color: #300045;
        font-weight: 900;
        background: #ffba2e;
      }

      h1 {
        margin: 0;
        font-size: 1.18rem;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #62536f;
        font-size: 0.94rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">MCU</div>
      <h1>Completing Microsoft sign-in</h1>
      <p>This window should close automatically. You can close it if it stays open.</p>
    </main>
    <script>
      window.setTimeout(function closePopup() {
        window.close()
      }, 2500)
    </script>
  </body>
</html>
